name: Test Report Action

on:
  pull_request:
    paths:
      - 'packages/report-action/**'
  push:
    branches: ['*']
    paths:
      - 'packages/report-action/**'

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build report-action
        run: |
          cd packages/report-action
          pnpm run build
      
      - name: Test PR Mode
        uses: ./packages/report-action
        id: pr-test
        with:
          mode: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check Output
        run: |
          echo "Patch file: ${{ steps.pr-test.outputs.patch }}"
          cat ${{ steps.pr-test.outputs.patch }}

  test-commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build report-action
        run: |
          cd packages/report-action
          pnpm run build
      
      - name: Test Commit Mode
        uses: ./packages/report-action
        id: commit-test
        with:
          mode: commit
          base: HEAD~1
          head: HEAD
      
      - name: Check Output
        run: |
          echo "Patch file: ${{ steps.commit-test.outputs.patch }}"
          cat ${{ steps.commit-test.outputs.patch }}

  test-auto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build report-action
        run: |
          cd packages/report-action
          pnpm run build
      
      - name: Test Auto Mode
        uses: ./packages/report-action
        id: auto-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check Output
        run: |
          echo "Patch file: ${{ steps.auto-test.outputs.patch }}"
          cat ${{ steps.auto-test.outputs.patch }}

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run unit tests
        run: |
          cd packages/report-action
          pnpm test