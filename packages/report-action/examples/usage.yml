# Example GitHub Workflow using Canyon Report Action

name: Canyon Coverage Analysis

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Generate patch.json
      - name: Generate Canyon Patch
        uses: canyonjs/report-action@v1
        id: canyon-patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Use patch with Canyon reporter
      - name: Run Canyon Coverage
        run: |
          # Install Canyon CLI (example)
          npm install -g @canyonjs/cli
          
          # Run coverage analysis with generated patch
          canyon-report --patch ${{ steps.canyon-patch.outputs.patch }}

      # Step 3: Upload results
      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: canyon-coverage
          path: |
            ${{ steps.canyon-patch.outputs.patch }}
            coverage/