name: Test Action

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Test PR Mode
        uses: ./
        id: pr-test
        with:
          mode: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check Output
        run: |
          echo "Patch file: ${{ steps.pr-test.outputs.patch }}"
          cat ${{ steps.pr-test.outputs.patch }}

  test-commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Test Commit Mode
        uses: ./
        id: commit-test
        with:
          mode: commit
          base: HEAD~1
          head: HEAD
      
      - name: Check Output
        run: |
          echo "Patch file: ${{ steps.commit-test.outputs.patch }}"
          cat ${{ steps.commit-test.outputs.patch }}

  test-auto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Test Auto Mode
        uses: ./
        id: auto-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check Output
        run: |
          echo "Patch file: ${{ steps.auto-test.outputs.patch }}"
          cat ${{ steps.auto-test.outputs.patch }}